<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة</title>
<style>
body{margin:0;font-family:Arial;background:#f3f4f6}header{background:#111827;color:white;padding:20px;font-size:22px}
.container{padding:20px;max-width:900px;margin:auto}.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #0001}
input,select,button{width:100%;padding:12px;margin-top:8px;margin-bottom:12px;box-sizing:border-box;border-radius:8px;border:1px solid #ddd}
button{background:#2563eb;color:white;border:0;cursor:pointer}.company{border:1px solid #ddd;padding:15px;border-radius:10px;margin-top:10px}.active{color:green;font-weight:bold}
</style></head>
<body>
<header>🎁 Reward App — لوحة الإدارة</header>
<div class="container">
<div class="card"><h2>🏢 إضافة شركة</h2>
<label>اسم الشركة</label><input id="name" placeholder="مثال: AdGem">
<label>نوع الشركة</label><select id="type"><option>Offerwall</option><option>Survey</option><option>Ads</option></select>
<button onclick="addCompany()">＋ إضافة الشركة</button></div>
<div class="card"><h2>🏢 الشركات</h2><div id="companies">جاري التحميل...</div></div>
</div>
<script>
async function loadCompanies(){
 const response=await fetch("/api/companies"); const companies=await response.json();
 const box=document.getElementById("companies"); box.innerHTML="";
 companies.forEach(c=>box.innerHTML+=`<div class="company"><h3>🏢 ${c.name}</h3><p>النوع: <b>${c.type}</b></p><p class="active">● مفعلة</p></div>`);
}
async function addCompany(){
 const name=document.getElementById("name").value.trim(), type=document.getElementById("type").value;
 if(!name){alert("اكتب اسم الشركة");return;}
 await fetch("/api/companies",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,type})});
 document.getElementById("name").value=""; loadCompanies();
}
loadCompanies();
</script></body></html>
